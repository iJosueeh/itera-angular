<footer class="mt-3 border-t border-[#e2e4f4] bg-white/88">
  <div class="mx-auto grid min-h-[74px] max-w-[1100px] grid-cols-1 items-center gap-3 px-5 py-3 text-center lg:grid-cols-[auto_1fr_auto] lg:text-left">
    <p class="m-0 font-[Sora] font-bold text-[#3537bf]">{{ brand() }}</p>

    <ul class="m-0 flex list-none flex-wrap justify-center gap-4 p-0" aria-label="Enlaces legales">
      @for (link of links(); track link.label) {
        <li>
          <a [href]="link.href" class="text-[0.85rem] text-[#5e607f] no-underline">{{ link.label }}</a>
        </li>
      }
    </ul>

    <p class="m-0 text-[0.85rem] text-[#5e607f]">© 2026 Itera AI Mentor. All rights reserved.</p>
  </div>
</footer>
