<main
  class="min-h-screen bg-[radial-gradient(circle_at_top,_#f0ecff_0%,_#eef2ff_45%,_#f7fbff_100%)] text-[#16162a]"
>
  <itera-top-nav [brand]="vm().brand" [items]="vm().navItems" />

  <section class="mx-auto max-w-[1100px] px-4 pt-4 sm:px-5 sm:pt-8">
    <div
      class="rounded-[24px] border border-white/70 bg-white/45 px-4 py-5 shadow-[0_25px_60px_rgba(73,84,174,0.14)] backdrop-blur-xl sm:rounded-[28px] sm:px-7 sm:py-8"
    >
      <itera-hero-search [content]="vm().hero" (explore)="handleSearch($event)" />

      @if (career()) {
        <div class="mt-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
          <div class="rounded-2xl border border-indigo-100 bg-white/60 p-5">
            <h3 class="text-lg font-bold text-indigo-900">{{ career()?.career }}</h3>
            <div class="mt-3 grid grid-cols-2 gap-4 sm:grid-cols-3">
              <div>
                <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Salario Anual</p>
                <p class="text-sm font-bold text-slate-800">{{ career()?.annualSalaryUsd }}</p>
              </div>
              <div>
                <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Demanda</p>
                <p class="text-sm font-bold text-slate-800">{{ career()?.demandLevel }}</p>
              </div>
              <div class="hidden sm:block">
                <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Fit del Perfil</p>
                <p class="text-sm font-bold text-indigo-600">{{ career()?.profileFit }}</p>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </section>

  <itera-feature-highlights [cards]="vm().featureCards" [progress]="vm().progress" />

  <itera-mentor-banner [mentor]="vm().mentor" />

  <itera-footer [brand]="vm().brand" [links]="vm().footerLinks" />
</main>
