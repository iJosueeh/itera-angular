<aside
  class="relative hidden min-h-screen overflow-hidden bg-gradient-to-br from-emerald-50 to-teal-50 p-12 text-slate-900 lg:flex flex-col border-r border-slate-200"
>
  <!-- Subtle background decoration -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 -left-40 w-80 h-80 bg-emerald-100/50 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 flex h-full flex-col">
    <!-- Badge -->
    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 text-[0.65rem] font-bold uppercase tracking-wider text-primary bg-primary/5 border border-primary/10 rounded-full w-fit">
      <i class="bi bi-stars text-[10px]"></i>
      {{ vm().visualTag }}
    </span>

    <!-- Title -->
    <h1 class="mt-10 max-w-md text-4xl md:text-5xl font-bold text-slate-900 tracking-tight leading-[1.1]">
      {{ vm().visualTitle }}<span class="text-primary">.</span>
    </h1>

    <!-- Subtitle -->
    <p class="mt-6 max-w-md text-base text-slate-500 leading-relaxed">
      {{ vm().visualSubtitle }}
    </p>

    <!-- Stats cards -->
    <div class="mt-12 space-y-3">
      @for (bullet of vm().visualBullets; track bullet.title) {
        <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center gap-4 shadow-sm hover:shadow-md transition-all duration-300">
          <div class="w-10 h-10 rounded-lg bg-primary/5 flex items-center justify-center shrink-0">
            <i [class]="'text-lg text-primary ' + bullet.icon" aria-hidden="true"></i>
          </div>
          <div>
            <p class="m-0 text-sm font-bold text-slate-800">{{ bullet.title }}</p>
            <p class="m-0 text-xs text-slate-400 mt-0.5">{{ bullet.description }}</p>
          </div>
        </div>
      }
    </div>

    <!-- Mentor quote -->
    <div class="mt-auto pt-12">
      <p class="text-[0.65rem] font-bold uppercase tracking-wider text-primary mb-3">
        {{ vm().mentorName }}
      </p>
      <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
        <p class="m-0 text-sm leading-relaxed text-slate-600 italic">
          "{{ vm().mentorQuote }}"
        </p>
      </div>
    </div>
  </div>
</aside>
