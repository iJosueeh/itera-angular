<aside
  class="relative hidden min-h-screen overflow-hidden bg-[radial-gradient(circle_at_top_left,_#1a1b3a_0%,_#09090f_100%)] p-12 text-white lg:block border-r border-white/[0.03]"
>
  <div class="absolute inset-0 opacity-30" aria-hidden="true">
    <div class="absolute -left-20 -top-20 h-[500px] w-[500px] rounded-full bg-primary/20 blur-[120px]"></div>
    <div class="absolute right-0 top-1/3 h-[400px] w-[400px] rounded-full bg-accent/10 blur-[100px]"></div>
  </div>

  <div class="relative z-10 flex h-full flex-col">
    <span
      class="badge badge-primary border-none text-white font-black uppercase tracking-[0.25em] text-[0.6rem] py-3 px-4 shadow-lg shadow-primary/20"
    >
      {{ vm().visualTag }}
    </span>

    <h1 class="mt-12 max-w-lg font-black text-6xl leading-[0.95] tracking-tighter">
      {{ vm().visualTitle }}<span class="text-primary">.</span>
    </h1>

    <p class="mt-10 max-w-xl text-xl text-white/50 leading-relaxed font-medium">
      {{ vm().visualSubtitle }}
    </p>

    <div class="mt-16 space-y-5">
      @for (bullet of vm().visualBullets; track bullet.title) {
        <article
          class="rounded-[2rem] border border-white/[0.03] bg-white/[0.02] px-8 py-6 backdrop-blur-md transition-all duration-300 hover:bg-white/[0.05]"
        >
          <div class="flex items-start gap-5">
            <div class="grid h-10 w-10 place-content-center rounded-xl bg-primary/10 text-primary">
              <i [class]="'text-xl ' + bullet.icon" aria-hidden="true"></i>
            </div>
            <div>
              <p class="m-0 text-lg font-black tracking-tight">{{ bullet.title }}</p>
              <p class="m-0 mt-1 text-sm text-white/40 font-medium">{{ bullet.description }}</p>
            </div>
          </div>
        </article>
      }
    </div>

    <div class="mt-auto flex flex-col">
      <p class="text-[0.65rem] font-black uppercase tracking-[0.3em] text-primary mb-4">
        {{ vm().mentorName }}
      </p>
      <div
        class="rounded-[2.5rem] border border-white/[0.03] bg-neutral/40 p-10 backdrop-blur-xl shadow-2xl"
      >
        <p class="m-0 text-lg italic leading-relaxed text-white/70 font-medium">"{{ vm().mentorQuote }}"</p>
      </div>
    </div>
  </div>
</aside>
