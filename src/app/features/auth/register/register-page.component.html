<main class="grid min-h-screen grid-cols-1 lg:grid-cols-2">
  <itera-register-visual [vm]="vm()" />

  <section class="relative">
    <itera-register-form
      [vm]="vm()"
      [isSubmitting]="isSubmitting()"
      (submitRegister)="onSubmit($event)"
    />

    @if (responseMessage()) {
      <div
        class="fixed top-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-[430px] z-50 bg-emerald-50 border border-emerald-200 text-emerald-700 font-semibold rounded-2xl shadow-lg p-4 flex items-center gap-3"
      >
        <i class="bi bi-check-circle-fill text-emerald-500"></i>
        <span>{{ responseMessage() }}</span>
      </div>
    }

    @if (responseError()) {
      <div
        class="fixed top-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-[430px] z-50 bg-rose-50 border border-rose-200 text-rose-600 font-semibold rounded-2xl shadow-lg p-4 flex items-center gap-3"
      >
        <i class="bi bi-exclamation-triangle-fill text-rose-500"></i>
        <span>{{ responseError() }}</span>
      </div>
    }
  </section>
</main>
