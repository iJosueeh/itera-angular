<main class="grid min-h-screen grid-cols-1 lg:grid-cols-2">
  <itera-register-visual [vm]="vm()" />

  <section class="relative">
    <itera-register-form
      [vm]="vm()"
      [isSubmitting]="isSubmitting()"
      (submitRegister)="onSubmit($event)"
    />

    @if (responseMessage()) {
      <div class="alert alert-success fixed top-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-[430px] z-50 bg-secondary/10 border-secondary/20 text-secondary font-bold rounded-2xl shadow-2xl backdrop-blur-xl animate-in fade-in slide-in-from-top-4 duration-500">
        <i class="bi bi-check-circle-fill"></i>
        <span>{{ responseMessage() }}</span>
      </div>
    }

    @if (responseError()) {
      <div class="alert alert-error fixed top-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-[430px] z-50 bg-rose-500/10 border-rose-500/20 text-red-400 font-bold rounded-2xl shadow-2xl backdrop-blur-xl animate-in fade-in slide-in-from-top-4 duration-500">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ responseError() }}</span>
      </div>
    }
  </section>
</main>
