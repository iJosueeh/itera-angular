<section class="flex min-h-screen items-center bg-slate-50 px-6 py-12">
  <div class="mx-auto w-full max-w-[440px]">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 md:p-10">
      <!-- Brand -->
      <div class="mb-8">
        <span class="inline-flex items-center gap-1.5 text-xs font-bold text-primary">
          <i class="bi bi-stars text-[10px]"></i>
          {{ vm().formEyebrow }}
        </span>
      </div>

      <!-- Title -->
      <h2 class="text-3xl font-bold text-slate-900 tracking-tight">
        {{ vm().formTitle }}
      </h2>
      <p class="mt-2 text-sm text-slate-500">{{ vm().formSubtitle }}</p>

      <form class="mt-8 space-y-4" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
            {{ vm().fullNameLabel }}
          </label>
          <div class="relative">
            <input
              type="text"
              formControlName="fullName"
              class="w-full h-12 px-4 pr-11 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
              placeholder="Juan Perez"
            />
            <i class="bi bi-person absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
            {{ vm().emailLabel }}
          </label>
          <div class="relative">
            <input
              type="email"
              formControlName="email"
              class="w-full h-12 px-4 pr-11 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
              placeholder="juan@ejemplo.com"
            />
            <i class="bi bi-envelope absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
            {{ vm().passwordLabel }}
          </label>
          <div class="relative">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              class="w-full h-12 px-4 pr-11 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
              placeholder="••••••••"
            />
            <button
              type="button"
              (click)="showPassword.set(!showPassword())"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors bg-transparent border-none p-1 cursor-pointer"
            >
              <i
                class="bi text-lg"
                [class.bi-eye]="!showPassword()"
                [class.bi-eye-slash]="showPassword()"
              ></i>
            </button>
          </div>
          <p class="mt-1.5 text-xs text-slate-400">{{ vm().passwordHint }}</p>
        </div>

        <!-- Error -->
        @if (formError()) {
          <div class="bg-rose-50 border border-rose-200 text-rose-600 text-xs font-semibold rounded-xl p-3 flex items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill text-rose-500"></i>
            <span>{{ formError() }}</span>
          </div>
        }

        <!-- Submit -->
        <button
          type="submit"
          class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-semibold rounded-xl transition-all shadow-sm hover:shadow-md mt-4 flex items-center justify-center gap-2"
          [disabled]="isSubmitting()"
        >
          @if (isSubmitting()) {
            <span class="loading loading-spinner loading-sm"></span>
            Creando cuenta...
          } @else {
            {{ vm().primaryAction }}
            <i class="bi bi-arrow-right text-sm"></i>
          }
        </button>
      </form>

      <!-- Login link -->
      <p class="mt-8 text-center text-sm text-slate-500">
        {{ vm().loginPrompt }}
        <a
          routerLink="/auth/login"
          class="font-semibold text-primary hover:text-primary/80 transition-colors ml-1"
        >
          {{ vm().loginCta }}
        </a>
      </p>
    </div>
  </div>
</section>
