<section class="px-5 pb-12 pt-7" aria-label="Recomendación del mentor">
  <article
    class="mx-auto max-w-[900px] rounded-[24px] border border-[#e8ebf8] bg-white p-6 shadow-[0_20px_40px_rgba(53,55,191,0.12)] sm:p-7"
  >
    <div class="grid gap-4 sm:grid-cols-[auto_1fr] sm:items-start">
      <div
        class="grid h-12 w-12 place-content-center overflow-hidden rounded-full border-2 border-[#2ee3aa]/80 bg-[#0f172a] text-[0.8rem] font-bold tracking-[0.12em] text-white shadow-[0_10px_22px_rgba(15,23,42,0.28)]"
        role="img"
        [attr.aria-label]="mentor().avatarAlt"
      >
        {{ mentor().avatarInitials }}
      </div>

      <div>
        <p class="m-0 text-[0.86rem] font-semibold text-[#59609c]">{{ mentor().mentorName }}</p>
        <p
          class="mt-2 max-w-[760px] text-[clamp(1rem,2.15vw,1.28rem)] leading-[1.45] text-[#2a2d45]"
        >
          {{ mentor().messagePrefix }}
          <span class="font-semibold text-[#3d43bf]">{{ mentor().highlightedTerm }}</span>
          {{ mentor().messageSuffix }}
        </p>

        <div class="mt-5 flex flex-wrap items-center gap-4">
          <button
            type="button"
            class="cursor-pointer rounded-full border-0 bg-[#3d43bf] px-6 py-3 text-[0.9rem] font-semibold text-white shadow-[0_12px_24px_rgba(61,67,191,0.28)] transition-transform duration-200 hover:-translate-y-0.5 hover:bg-[#363bb2]"
          >
            {{ mentor().primaryAction }}
          </button>
          <button
            type="button"
            class="cursor-pointer border-0 bg-transparent px-1 py-3 text-[0.92rem] font-semibold text-[#6d70a8] transition-colors duration-200 hover:text-[#3d43bf]"
          >
            {{ mentor().secondaryAction }}
          </button>
        </div>
      </div>
    </div>
  </article>
</section>
