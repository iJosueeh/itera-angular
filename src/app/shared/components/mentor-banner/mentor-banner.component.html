<section class="px-5 pb-16 pt-8" aria-label="Recomendación del mentor">
  <article
    class="mx-auto max-w-[900px] rounded-[3rem] border border-white/[0.03] bg-neutral/60 p-8 shadow-[0_30px_60px_rgba(0,0,0,0.2)] backdrop-blur-md sm:p-10"
  >
    <div class="grid gap-6 sm:grid-cols-[auto_1fr] sm:items-start">
      <div
        class="grid h-14 w-14 place-content-center overflow-hidden rounded-2xl bg-primary text-base font-black tracking-widest text-white shadow-xl shadow-primary/20"
        role="img"
        [attr.aria-label]="mentor().avatarAlt"
      >
        {{ mentor().avatarInitials }}
      </div>

      <div>
        <p class="m-0 text-xs font-black uppercase tracking-[0.25em] text-primary">{{ mentor().mentorName }}</p>
        <p
          class="mt-3 max-w-[760px] text-[clamp(1.1rem,2vw,1.4rem)] leading-relaxed text-white/90 font-medium"
        >
          {{ mentor().messagePrefix }}
          <span class="text-primary font-bold">{{ mentor().highlightedTerm }}</span>
          {{ mentor().messageSuffix }}
        </p>

        <div class="mt-8 flex flex-wrap items-center gap-6">
          <button
            type="button"
            class="btn btn-primary rounded-2xl px-8 font-black uppercase tracking-widest shadow-xl shadow-primary/25 border-none"
          >
            {{ mentor().primaryAction }}
          </button>
          <button
            type="button"
            class="btn btn-ghost normal-case text-white/50 hover:text-white font-bold"
          >
            {{ mentor().secondaryAction }}
          </button>
        </div>
      </div>
    </div>
  </article>
</section>
