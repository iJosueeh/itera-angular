<div
  [attr.data-theme]="theme()"
  class="dashboard-shell flex min-h-screen flex-col bg-[radial-gradient(circle_at_top,_#1a1b3a_0%,_#0f0f16_55%,_#050508_100%)] text-white"
>
  <itera-top-nav [brand]="brand()" [items]="topNavItems()"></itera-top-nav>

  <div class="mx-auto flex w-full max-w-[1440px] flex-1 gap-6 px-4 py-6 lg:px-6">
    <aside
      class="dashboard-sidebar hidden w-[260px] shrink-0 rounded-[3rem] bg-neutral/40 border border-white/[0.03] p-6 shadow-2xl backdrop-blur-2xl lg:flex lg:flex-col"
    >
      <div class="px-2 pt-1">
        <p class="text-xs font-black uppercase tracking-[0.3em] text-primary mb-2">{{ sidebarTitle() }}</p>
        <div
          class="flex items-center gap-2 text-[0.68rem] font-bold uppercase tracking-widest text-white/40"
        >
          <span class="h-2 w-2 rounded-full bg-secondary shadow-[0_0_8px_rgba(99,102,241,0.6)]"></span>
          {{ sidebarStatus() }}
        </div>
      </div>

      @if (sidebarItems().length > 0) {
        <nav class="mt-10 flex-1" aria-label="Secciones del dashboard">
          <ul class="space-y-3">
            @for (item of sidebarItems(); track item.label) {
              <li>
                <a
                  [routerLink]="item.href"
                  [fragment]="item.fragment"
                  class="group flex items-center gap-4 rounded-2xl px-4 py-3.5 text-[0.92rem] font-bold no-underline transition-all duration-300"
                  [class.bg-white/10]="item.active === true"
                  [class.text-white]="item.active === true"
                  [class.shadow-lg]="item.active === true"
                  [class.text-white/40]="item.active !== true"
                  [class.hover:bg-white/5]="item.active !== true"
                  [class.hover:text-white]="item.active !== true"
                >
                  <i [class]="'bi text-lg transition-colors ' + item.icon" 
                     [class.text-primary]="item.active === true"
                     [class.opacity-50]="item.active !== true"></i>
                  {{ item.label }}
                </a>
              </li>
            }
          </ul>
        </nav>
      }
    </aside>

    <main class="min-w-0 flex flex-1 flex-col pb-24 lg:pb-8">
      <ng-content select="[dashboard-main]"></ng-content>
    </main>
  </div>

  <!-- Mobile Bottom Nav -->
  @if (sidebarItems().length > 0) {
    <nav class="fixed bottom-0 left-0 z-50 w-full border-t border-white/[0.03] bg-black/40 px-4 py-3 backdrop-blur-2xl lg:hidden">
      <ul class="flex justify-around items-center">
        @for (item of sidebarItems().slice(0, 4); track item.label) {
          <li>
            <a
              [routerLink]="item.href"
              [fragment]="item.fragment"
              class="flex flex-col items-center gap-1.5 p-2 no-underline transition-colors"
              [class.text-primary]="item.active === true"
              [class.text-white/30]="item.active !== true"
            >
              <i [class]="'bi ' + item.icon + ' text-2xl'"></i>
              <span class="text-[0.6rem] font-black uppercase tracking-widest">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  }

  <div class="w-full border-t border-white/[0.03]"></div>
  <div class="mx-auto w-full max-w-[1440px] px-4 mt-6 lg:px-6">
    <itera-footer [brand]="brand()" [links]="footerLinks()"></itera-footer>
  </div>
</div>
