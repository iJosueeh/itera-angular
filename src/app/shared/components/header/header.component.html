<header class="sticky top-0 z-30 border-b border-white/[0.05] bg-base-100/85 backdrop-blur-xl">
  <div class="mx-auto flex min-h-[72px] max-w-[1200px] items-center justify-between gap-4 px-5">
    <a
      href="/"
      class="font-display text-[1.4rem] font-bold text-primary no-underline"
      aria-label="Ir al inicio"
    >
      {{ brand() }}
    </a>

    @if (items().length > 0) {
      <nav aria-label="Navegación principal">
        <ul class="m-0 flex list-none items-center gap-5 p-0">
          @for (item of items(); track item.label) {
            <li>
              <a
                [href]="item.href"
                class="border-b-2 border-transparent pb-2 font-medium text-white/50 no-underline transition-colors duration-200 hover:text-white"
                [class.text-primary]="item.active === true"
                [class.border-primary]="item.active === true"
                [class.text-white]="item.active !== true"
                [attr.aria-current]="item.active ? 'page' : null"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    }

    @if (showUserActions()) {
      <div class="flex items-center gap-2" aria-label="Acciones del usuario">
        <button
          type="button"
          class="grid h-9 w-9 cursor-pointer place-content-center rounded-full border-0 bg-white/5 text-primary hover:bg-white/10 transition-colors"
          aria-label="Notificaciones"
        >
          <i class="bi bi-bell-fill" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="grid h-9 w-9 cursor-pointer place-content-center rounded-full border-0 bg-white/5 text-primary hover:bg-white/10 transition-colors"
          aria-label="Perfil"
        >
          <i class="bi bi-person-circle" aria-hidden="true"></i>
        </button>
      </div>
    }
  </div>
</header>
