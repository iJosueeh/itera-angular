<footer class="mt-12 border-t border-white/[0.05] bg-black/20 backdrop-blur-md">
  <div
    class="mx-auto grid min-h-[80px] max-w-[1100px] grid-cols-1 items-center gap-6 px-5 py-8 text-center lg:grid-cols-[auto_1fr_auto] lg:text-left"
  >
    <p class="m-0 font-[Sora] font-black text-white text-xl tracking-tighter">
      {{ brand() }}<span class="text-primary">.</span>
    </p>

    @if (links().length > 0) {
      <ul
        class="m-0 flex list-none flex-wrap justify-center gap-8 p-0"
        aria-label="Enlaces legales"
      >
        @for (link of links(); track link.label) {
          <li>
            <a
              [href]="link.href"
              class="text-[0.8rem] font-bold uppercase tracking-widest text-white/30 no-underline hover:text-primary transition-colors"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
    }

    <p class="m-0 text-[0.8rem] font-medium text-white/20">{{ copyright() }}</p>
  </div>
</footer>
