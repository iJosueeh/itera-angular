<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/80 backdrop-blur-xl">
  <div class="mx-auto flex min-h-[72px] max-w-[1100px] items-center justify-between gap-4 px-5">
    <a
      routerLink="/"
      class="brand-link font-display text-[1.5rem] font-extrabold text-slate-900 no-underline tracking-tighter"
      aria-label="Ir al inicio"
    >
      {{ brand() }}<span class="text-primary">.</span>
    </a>

    <nav aria-label="Navegación principal">
      <ul class="m-0 flex list-none flex-wrap items-center gap-1 p-0 md:gap-2">
        @for (item of items(); track item.label) {
          <li>
            <a
              [routerLink]="item.href"
              [fragment]="item.fragment"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.active === true }"
              class="nav-link group flex items-center gap-2 rounded-full border border-transparent px-2 py-2 text-[0.92rem] font-semibold text-slate-500 no-underline transition-all duration-200 hover:bg-slate-100 hover:text-slate-800 md:px-4"
              [class.text-primary]="item.active === true"
              [class.bg-primary/10]="item.active === true"
              [class.border-primary/20]="item.active === true"
              [attr.aria-current]="item.active ? 'page' : null"
            >
              <i
                class="bi opacity-70 group-hover:opacity-100 transition-opacity"
                [ngClass]="item.icon"
              ></i>
              <span class="hidden md:inline">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-4" aria-label="Acciones del usuario">
      @if (isAuthenticated()) {
        <button
          (click)="logout()"
          class="hidden sm:inline-flex btn btn-ghost btn-sm normal-case text-slate-400 hover:text-slate-700"
        >
          Cerrar Sesión
        </button>
        <div class="avatar placeholder">
          <div
            class="bg-primary text-primary-content rounded-full w-9 h-9 flex items-center justify-center shadow-[0_0_15px_rgba(0,161,129,0.3)]"
          >
            <span class="text-[0.7rem] font-black tracking-tighter">ST</span>
          </div>
        </div>
      } @else {
        <a
          routerLink="/auth/login"
          class="auth-link hidden sm:inline-flex btn btn-ghost btn-sm normal-case text-slate-500 hover:text-slate-800"
        >
          Entrar
        </a>
        <a
          routerLink="/auth/register"
          class="btn btn-primary btn-sm rounded-xl px-5 font-bold shadow-lg shadow-primary/20 border-none"
        >
          Registrar
        </a>
      }
    </div>
  </div>
</header>
