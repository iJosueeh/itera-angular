<header class="sticky top-0 z-30 border-b border-[#e2e4f4] bg-white/85 backdrop-blur">
  <div class="mx-auto flex min-h-[72px] max-w-[1100px] items-center justify-between gap-4 px-5">
    <a
      routerLink="/"
      class="font-[Sora] text-[1.4rem] font-bold text-[#3537bf] no-underline"
      aria-label="Ir al inicio"
    >
      {{ brand() }}
    </a>

    <nav aria-label="Navegación principal">
      <ul class="m-0 flex list-none flex-wrap items-center gap-1 p-0 md:gap-3">
        @for (item of items(); track item.label) {
          <li>
            <a
              [routerLink]="item.href"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.active === true }"
              class="group flex items-center gap-2 rounded-full border border-transparent px-2 py-2 text-[0.92rem] font-medium text-[#5e607f] no-underline transition-colors duration-200 hover:border-[#d9def8] hover:bg-[#f7f8ff] hover:text-[#3537bf] md:px-3"
              [class.text-[#3537bf]]="item.active === true"
              [class.border-[#3537bf]]="item.active === true"
              [class.bg-[#f0f2ff]]="item.active === true"
              [class.text-[#16162a]]="item.active !== true"
              [attr.aria-current]="item.active ? 'page' : null"
            >
              <span
                class="grid h-8 w-8 place-content-center rounded-full bg-[#ececfc] text-[#3537bf] transition-transform duration-200 group-hover:scale-105"
                aria-hidden="true"
              >
                <i class="bi" [ngClass]="item.icon"></i>
              </span>
              <span class="hidden md:inline">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-2" aria-label="Acciones del usuario">
      <a
        routerLink="/auth/login"
        class="grid h-10 w-10 place-content-center rounded-full border border-[#e2e4f4] bg-white text-[#3537bf] no-underline transition-transform duration-200 hover:-translate-y-0.5 hover:bg-[#f7f8ff]"
        aria-label="Ir a iniciar sesión"
      >
        <i class="bi bi-box-arrow-in-right text-[1.02rem]" aria-hidden="true"></i>
      </a>
      <a
        routerLink="/auth/register"
        class="grid h-10 w-10 place-content-center rounded-full border border-[#e2e4f4] bg-white text-[#3537bf] no-underline transition-transform duration-200 hover:-translate-y-0.5 hover:bg-[#f7f8ff]"
        aria-label="Ir a registrarse"
      >
        <i class="bi bi-person-plus text-[1.02rem]" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</header>
