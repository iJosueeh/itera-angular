<article
  class="rounded-[22px] bg-white p-6 shadow-[0_14px_30px_rgba(53,55,191,0.06)] border border-slate-200"
>
  <div class="flex items-center gap-2 mb-4">
    <i class="bi bi-lightbulb-fill text-primary text-lg" aria-hidden="true"></i>
    <p class="text-[0.72rem] font-bold uppercase tracking-widest text-primary">Consejo del Mentor</p>
  </div>
  <h2 class="text-[1.1rem] font-bold text-slate-900 leading-snug">{{ title() }}</h2>
  <p class="mt-3 text-sm text-slate-500 leading-relaxed">{{ message() }}</p>
  <button
    type="button"
    (click)="actionClick.emit()"
    class="mt-5 flex w-full items-center justify-center gap-2 rounded-xl border-0 bg-primary px-5 py-2.5 text-sm font-bold text-white shadow-sm transition-all hover:bg-primary/90 hover:shadow-md"
  >
    {{ buttonText() }}
    <i class="bi bi-arrow-right" aria-hidden="true"></i>
  </button>
</article>
