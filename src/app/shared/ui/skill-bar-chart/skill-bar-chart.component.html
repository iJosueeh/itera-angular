<div class="skill-bar-chart">
  @for (item of chartData(); track item.label; let i = $index) {
    <div class="skill-row group">
      <div class="flex items-center justify-between mb-1.5">
        <span
          class="skill-label text-sm font-medium text-white/80 group-hover:text-white transition-colors"
        >
          {{ item.label }}
        </span>
        @if (showValues()) {
          <span
            class="skill-value text-xs font-mono font-medium text-white/50 group-hover:text-primary transition-colors"
          >
            {{ item.value | number: '1.0-0' }}
          </span>
        }
      </div>
      <div class="bar-bg h-2 rounded-full bg-white/5 overflow-hidden">
        <div
          class="h-full rounded-full transition-all duration-700 ease-out"
          [class]="getBarColor(i)"
          [style.width]="getBarWidth(item)"
          [class.animate-bar]="animated()"
          [style.animation-delay]="i * 50 + 'ms'"
          role="progressbar"
          [attr.aria-valuenow]="item.value"
          [attr.aria-valuemin]="0"
          [attr.aria-valuemax]="item.maxValue"
          [attr.aria-label]="item.label + ': ' + item.value"
        ></div>
      </div>
    </div>
  }
</div>
