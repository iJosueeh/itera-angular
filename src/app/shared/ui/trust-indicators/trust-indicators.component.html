<div class="trust-indicators">
  @for (metric of metrics(); track metric.label; let i = $index) {
    <div class="trust-item group">
      <div class="trust-icon-bg flex items-center justify-center w-10 h-10 rounded-xl bg-white/5 text-primary mb-3 group-hover:bg-primary/10 transition-colors">
        <i [class]="'bi ' + metric.icon + ' text-lg'"></i>
      </div>
      <p class="trust-value text-2xl md:text-3xl font-bold text-white font-mono tracking-tight">
        {{ metric.prefix || '' }}{{ getDisplayValue(i) | number }}{{ metric.suffix || '' }}
      </p>
      <p class="trust-label text-[0.7rem] font-medium text-white/40 mt-1 uppercase tracking-wider">
        {{ metric.label }}
      </p>
    </div>
  }
</div>
